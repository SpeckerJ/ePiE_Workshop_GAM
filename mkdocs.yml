site_name: ePiE Manual (GAM - Cambridge, 2026) 

nav:
  - Start Page: index.md
  - 'How to: The ePiE App': ePiE_webapp_GAM.md
  - "Exercises": ePiE_exercises.md
  - "Interpretation & Discussion": Interpretation_Discussion.md


theme:
  name: material
 # logo: ../img/logo/Premier_Logo.png
  features:
    - navigation.footer
    - content.footnote.tooltips
  
  palette:
    primary: white

markdown_extensions:
  - attr_list
  - footnotes
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - glightbox:

